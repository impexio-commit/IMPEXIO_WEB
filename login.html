<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPEXIO Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1a3a52 0%, #2d5a7b 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; padding: 40px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #1a3a52; font-size: 28px; margin-bottom: 5px; }
        .logo p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"], input[type="date"], select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; transition: border-color 0.3s; }
        input:focus, select:focus { outline: none; border-color: #2d5a7b; box-shadow: 0 0 5px rgba(45, 90, 123, 0.3); }
        .btn { width: 100%; padding: 12px; background: #2d5a7b; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn:hover { background: #1a3a52; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .alert { padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; display: none; }
        .alert.error { background: #fee; color: #c33; border: 1px solid #fcc; }
        .alert.info { background: #eef; color: #33c; border: 1px solid #ccf; }
        .wizard { display: none; }
        .wizard.active { display: block; }
        .wizard-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #ddd; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #666; font-size: 12px; }
        .step-dot.active { background: #2d5a7b; color: white; }
        .step-title { margin-bottom: 20px; color: #333; font-size: 18px; font-weight: 600; }
        .loading { display: none; text-align: center; color: #666; margin-top: 20px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid #f3f3f3; border-top: 3px solid #2d5a7b; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🚀 IMPEXIO</h1>
            <p>Trade Suite v1.0</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <!-- STEP 1: Client Code -->
        <div id="step1" class="wizard active">
            <div class="wizard-nav">
                <div class="step-dot active">1</div>
                <div class="step-dot">2</div>
                <div class="step-dot">3</div>
            </div>
            <div class="step-title">Enter Client Code</div>
            <div class="form-group">
                <label>Client Code *</label>
                <input type="text" id="clientCode" placeholder="e.g., IMP001" autofocus>
            </div>
            <button class="btn" onclick="goStep2()">Next →</button>
        </div>

        <!-- STEP 2: Email & Password -->
        <div id="step2" class="wizard">
            <div class="wizard-nav">
                <div class="step-dot active">1</div>
                <div class="step-dot active">2</div>
                <div class="step-dot">3</div>
            </div>
            <div class="step-title">Login Credentials</div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="goStep1()" style="background: #999;">← Back</button>
                <button class="btn" onclick="doLogin()" style="flex: 1;">Login</button>
            </div>
        </div>

        <!-- STEP 3: Company & Year (For Customers Only) -->
        <div id="step3" class="wizard">
            <div class="wizard-nav">
                <div class="step-dot active">1</div>
                <div class="step-dot active">2</div>
                <div class="step-dot active">3</div>
            </div>
            <div class="step-title">Select Company & Year</div>
            <div class="form-group">
                <label>Company</label>
                <input type="text" id="companyName" placeholder="Company name" disabled>
            </div>
            <div class="form-group">
                <label>Financial Year *</label>
                <select id="year" onchange="updateYear()">
                    <option value="">Select year</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="goStep2()" style="background: #999;">← Back</button>
                <button class="btn" onclick="goMain()" style="flex: 1;">Enter →</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script>
        const API_BASE = 'https://impexio.in/api';

        function showAlert(msg, type='error') {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = `alert ${type}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 5000);
        }

        function setLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function goStep1() {
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
        }

        function goStep2() {
            const cc = document.getElementById('clientCode').value.trim();
            if (!cc) {
                showAlert('Please enter Client Code');
                return;
            }
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            document.getElementById('email').focus();
        }

        async function doLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('Email and password required');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch(`${API_BASE}/auth/login.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const json = await res.json();
                setLoading(false);

                if (!json.success) {
                    showAlert(json.message || 'Login failed');
                    return;
                }

                // Save to session storage
                const sess = {
                    token: json.data.token,
                    username: json.data.fullName,
                    email: json.data.email,
                    role: json.data.role,
                    clientCode: json.data.clientCode,
                    companyName: json.data.companyName,
                    expiry: json.data.expiry,
                    subExpiry: json.data.subExpiry
                };

                sessionStorage.setItem('impexio', JSON.stringify(sess));
                localStorage.setItem('impexio_admin', JSON.stringify(sess));

                // If Owner → go to admin dashboard
                if (json.data.role === 'Owner') {
                    setTimeout(() => {
                        window.location.href = 'admin/admin-dashboard.html';
                    }, 500);
                    return;
                }

                // If Customer → show Step 3 (Company & Year selection)
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
                document.getElementById('companyName').value = json.data.companyName || '';

                // Populate years
                const yearSelect = document.getElementById('year');
                yearSelect.innerHTML = '<option value="">Select year</option>';
                const currentYear = new Date().getFullYear();
                for (let y = currentYear; y >= currentYear - 5; y--) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    yearSelect.appendChild(opt);
                }
                yearSelect.value = currentYear;

            } catch (err) {
                setLoading(false);
                showAlert('Unable to connect to server. Check your connection.');
                console.error(err);
            }
        }

        function updateYear() {
            const year = document.getElementById('year').value;
            if (!year) {
                showAlert('Please select a year');
            }
        }

        function goMain() {
            const year = document.getElementById('year').value;
            if (!year) {
                showAlert('Please select a year');
                return;
            }

            const sess = JSON.parse(sessionStorage.getItem('impexio'));
            sess.year = { label: year, value: year };
            sess.company = { id: 1, name: document.getElementById('companyName').value };
            sessionStorage.setItem('impexio', JSON.stringify(sess));

            setTimeout(() => {
                window.location.href = 'main.html';
            }, 500);
        }
    </script>
</body>
</html>
